name: Deploy SvelteKit + CDK to AWS

on:
  push:
    branches:
      - add-cdk

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      issues: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - run: echo "🌅 Job triggered by ${{ github.event_name }} event"
      - run: echo "💨 Job running on ${{ runner.os }}"
      - run: echo "🕊️ Branch is ${{ github.ref }}"
      - run: echo "👾 Repository is ${{ github.repository }}."

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --force
        env:
          ROLLUP_NO_BINARY: 1

      - name: Build SvelteKit static site
        run: npm run build

      - name: Deploy CDK stack
        run: npx cdk deploy --require-approval never
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
